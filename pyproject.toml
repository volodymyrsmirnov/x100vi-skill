[project]
name = "x100vi"
version = "0.1.0"
description = "Read, write and preview film-simulation recipes on a Fujifilm X100VI over USB, with an agent skill for Claude and Codex."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Volodymyr Smirnov" }]
keywords = ["fujifilm", "x100vi", "film simulation", "recipe", "ptp", "agent skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]
dependencies = [
  "pyusb>=1.2.1",
  "libusb-package>=1.0.26",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/volodymyrsmirnov/x100vi-skill"
Issues = "https://github.com/volodymyrsmirnov/x100vi-skill/issues"

[project.scripts]
x100vi = "x100vi.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x100vi"]

[tool.hatch.build.targets.wheel.force-include]
"skills/x100vi" = "x100vi/_skill"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
  "camera: needs a real X100VI on USB; enabled with X100VI_HARDWARE=1",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "SIM102", "SIM108"]
